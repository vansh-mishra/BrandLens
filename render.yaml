services:
  - type: web
    name: brandlens-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: brandlens-db
          property: connectionString
      - key: DATABASE_SSLMODE
        value: disable
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_SECONDS
        value: 43200
      - key: OPENAI_MODEL
        value: gpt-4.1-mini

databases:
  - name: brandlens-db
    databaseName: brandlens
    user: brandlens
    plan: free
    region: singapore
